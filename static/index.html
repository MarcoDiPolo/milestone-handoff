<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Milestone Handoff</title><link rel="stylesheet" href="./panel.css"></head>
<body><main><header><span>Milestone Handoff</span><button id="refresh" type="button">Refresh</button></header><h1 id="title">Reading this Jira work item…</h1><div role="status" id="status"></div>
<section hidden id="detail"><dl><div><dt>Written due date</dt><dd id="due"></dd></div><div><dt>Issue status</dt><dd id="stage"></dd></div></dl>
<fieldset id="filters"><legend>Relationships counted as prerequisites</legend></fieldset><h2>Handoff evidence</h2><p id="finding"></p><ul id="links"></ul>
<button id="ask-reader" type="button" hidden>Ask Rovo for this handoff</button><span id="agent-status" role="status"></span>
<p id="limits">Only links and statuses visible to you in Jira appear here. Completion describes delivery readiness. It does not establish client acceptance or payment.</p></section></main><script src="./panel.bundle.js" defer></script></body></html>
